[package]
name = "shopping_rust_shopping"
version = "0.0.1"
edition = "2024"

[workspace]
exclude = ["benchmark"]

[profile.release]
opt-level = "s"
lto = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
log = { version = "0.4.29", features = ["kv"] }
golem-rust = { version = "3.0.1", features = ["export_golem_agentic", "chrono"] }
golem-ai-llm = { version = "0.5.5" }
golem-ai-llm-openrouter = { version = "0.5.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wstd = { version = "=0.6.5", features = ["default", "json"] }
chrono = "0.4.45"
email_address = "0.2.9"
uuid = { version = "1.29.0", features = ["v4"] }
schemars = { version = "1.2.3", features = ["preserve_order"] }
regex = "1.13.1"
futures = "0.3.34"
