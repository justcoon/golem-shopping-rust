# Schema for IDEA:
# $schema: https://schema.golem.cloud/app/golem/1.6.0/golem.schema.json
# Schema for vscode-yaml:
# yaml-language-server: $schema=https://schema.golem.cloud/app/golem/1.6.0/golem.schema.json

# Field reference: https://learn.golem.cloud/app-manifest#field-reference
# Creating HTTP APIs: https://learn.golem.cloud/invoke/making-custom-apis

manifestVersion: 1.6.0

app: golem-shopping-rust

environments:
  local:
    server: local
    componentPresets: release
  cloud:
    server: cloud
    componentPresets: release
components:
  shopping-rust:shopping:
    dir: ""
    templates: rust

    # Component environment variables can reference system environment variables with minijinja syntax:
    #
    #   env:
    #     ENV_VAR_1: "{{ ENV_VAR_1 }}"
    #     RENAMED_VAR_2: "{{ ENV_VAR_2 }}"
    #     COMPOSED_VAR_3: "{{ ENV_VAR_3 }}-{{ ENV_VAR_4}}"
    #\
agents:
  WebAssistant:
    files:
      - sourcePath: ./web
        targetPath: /web
        permissions: read-only
  WebManager:
    files:
      - sourcePath: ./web
        targetPath: /web
        permissions: read-only

secretDefaults:
  local:
    llm:
      #      apiKey: '{{ OPENROUTER_KEY }}'
      #      model: "openrouter/free"
      apiKey: '{{ GEMINI_API_KEY }}'
      model: "gemini-3.1-flash-lite"
      apiUrl: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
#      apiUrl: "https://generativelanguage.googleapis.com/v1beta"
httpApi:
  deployments:
    local:
    - domain: localhost:9006
      agents:
        ProductAgent: {}
        PricingAgent: {}
        InventoryAgent: {}
        ProductSearchAgent: {}
        CartAgent: {}
        OrderAgent: {}
        OrderSearchAgent: {}
        ShoppingAssistantAgent: {}
        ManagerAgent: {}
        WebAssistant: {}
        WebManager: {}
